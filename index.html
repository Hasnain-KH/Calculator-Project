<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <!-- <script src="app.js"></script> -->
</head>
<body>
  <div class="container">
    <div class="inp">
        <textarea id="display"></textarea>
         <div class="forbut">
            <div class="buton">
              <div class="setbutton">
                <button class="buttonins" value="AC">AC</button>
                <button class="buttonins" value="Del">Del</button>
                <button class="buttonins" value="1">1</button>
                <button class="buttonins" style="background-color: rgb(200, 99, 99);"  value="/">/</button>
                <button class="buttonins"  value="2">2</button>
                <button class="buttonins"  value="3">3</button>
                <button class="buttonins"  value="4">4</button>
                <button class="buttonins" style="background-color: rgb(200, 99, 99);" value="*">*</button>
                <button class="buttonins"  value="5">5</button>
                <button class="buttonins"  value="6">6</button>
                <button class="buttonins" value="7">7</button>
                <button class="buttonins" style="background-color: rgb(200, 99, 99);" value="-">-</button>
                <button class="buttonins" value="8">8</button>
                <button class="buttonins" value="9">9</button>
                <button class="buttonins"  value="0">0</button>
                <button class="buttonins" style="background-color: rgb(200, 99, 99);" value="+">+</button>
                <button class="buttonins" id="equal" value="=">=</button>
                <button class="buttonins" id="de" style="background-color: rgb(200, 99, 99);" value="%">%</button>
                </div>
            </div>
         </div>
  </div>
    <script src="app.js"></script>
</body>
</html>
